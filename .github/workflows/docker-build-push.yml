name: Build and Push to Harbor

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Login to Harbor
      uses: docker/login-action@v3
      with:
        registry: registry.analitika.tech
        username: ${{ secrets.HARBOR_USERNAME }}
        password: ${{ secrets.HARBOR_PASSWORD }}

    - name: Build Docker image
      run: |
        docker build -t registry.analitika.tech/${{ secrets.HARBOR_REGISTRY }}/fudbalskataktikapro:latest .

    - name: Push to Harbor
      run: |
        docker push registry.analitika.tech/${{ secrets.HARBOR_REGISTRY }}/fudbalskataktikapro:latest
